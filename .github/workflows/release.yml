name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under. Use beta to publish without moving latest."
        required: true
        default: beta
        type: choice
        options: [beta, latest]
  push:
    tags:
      - "v*"

# The npm packages must exist before the MCP registry entry points at them,
# otherwise the registry advertises a version nobody can install. These jobs
# run in order and the registry step is gated on npm succeeding.
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check release readiness
        run: npm run check:publishable

      # Dependency order matters: every package must be on npm before anything
      # that depends on it. @modwrench/ui in particular is required by five
      # other packages — publishing them without it makes all five uninstallable.
      #   core -> ui -> {nexus, modio, thunderstore, workbench} -> remote -> cli
      - name: Publish packages in dependency order
        run: |
          set -e
          for pkg in core ui nexus modio thunderstore workbench remote cli; do
            name="@modwrench/${pkg}"
            version=$(node -p "require('./packages/${pkg}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "SKIP  ${name}@${version} already published"
            else
              echo "PUBLISH ${name}@${version} --tag ${DIST_TAG}"
              npm publish --workspace "${name}" --provenance --access public --tag "${DIST_TAG}"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A tag push is a real release; a manual run defaults to beta so it
          # cannot move latest by accident.
          DIST_TAG: ${{ github.event.inputs.dist_tag || (startsWith(github.ref, 'refs/tags/v') && 'latest') || 'beta' }}

  mcp-registry:
    needs: npm
    # The MCP registry advertises one current version. A beta must not become
    # the version strangers discover, so only a real tag release updates it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify server.json matches the published package
        run: |
          set -e
          server_version=$(node -p "require('./server.json').version")
          pkg_version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$server_version" != "$pkg_version" ]; then
            echo "server.json version ($server_version) != @modwrench/cli ($pkg_version)"
            exit 1
          fi
          identifier=$(node -p "require('./server.json').packages[0].identifier")

          # npm's read replicas lag its write path, and npm itself says so:
          # every publish prints "Your package is being processed and may take
          # a few minutes to become available". Three releases have now measured
          # that lag against this guard.
          #
          #   0.2.0  one check, 8s after publish        -> failed
          #   0.2.1  10 attempts / 15s = 150s           -> passed
          #   0.2.2  10 attempts / 15s = 150s           -> failed
          #
          # So 150s sat right on the boundary and the window was the bug, not
          # the retry. @modwrench/cli is published LAST of the eight, which puts
          # it at the back of the propagation queue every time -- it is
          # structurally the slowest package to appear, and it is the one
          # server.json points at.
          #
          # The window is now 10 minutes, matching npm's own "a few minutes"
          # rather than a guess. This costs nothing when propagation is quick:
          # the loop exits on the first success, which is the common case.
          attempts=40
          interval=15
          for attempt in $(seq 1 "$attempts"); do
            if npm view "${identifier}@${pkg_version}" version; then
              echo "Confirmed ${identifier}@${pkg_version} is visible on npm after ~$(( (attempt - 1) * interval ))s."
              exit 0
            fi
            echo "Attempt ${attempt}/${attempts}: ${identifier}@${pkg_version} not visible yet; waiting ${interval}s."
            sleep "$interval"
          done

          echo "::error::${identifier}@${pkg_version} never became visible on npm after ~$(( attempts * interval ))s."
          echo "The npm job reported success, so the publish itself likely worked."
          echo "Check https://www.npmjs.com/package/${identifier} before re-running:"
          echo "  - visible now  -> propagation was just slow, re-run this job"
          echo "  - still absent -> the publish did not land, investigate the npm job"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json

  github-release:
    needs: npm
    # Same shape as the registry job: only a real tag release publishes, and
    # only after npm has succeeded — a Release describing a version that
    # failed to publish would be a lie with a download button.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The body is this repo's own CHANGELOG section for the tagged version,
      # not GitHub's auto-generated commit list — the changelog is maintained
      # by hand and says what a user needs to know.
      - name: Extract this version's CHANGELOG section
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          header="## [$version]"
          if ! grep -qF "$header" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '$header' section — write one before tagging."
            exit 1
          fi
          awk -v h="$header" \
            'index($0, h) == 1 {flag = 1; next} flag && /^## \[/ {exit} flag {print}' \
            CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::The '$header' section in CHANGELOG.md is empty."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md
