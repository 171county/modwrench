name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    # ModWrench detects games, mod managers and Proton prefixes through
    # OS-specific filesystem paths, so a Linux-only matrix cannot exercise the
    # code most users actually run. Test on all three.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
        # Node 20's test runner has no glob support and cmd.exe does not expand
        # globs, so `node --test test/*.test.ts` cannot run on Windows + Node 20.
        # The server itself runs fine there (engines >=20); only the test-suite
        # invocation needs Node 21+ globbing on Windows.
        exclude:
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Build before typecheck so each workspace's dist/*.d.ts exists
      # when downstream packages try to resolve `@mcpwrench/core`,
      # `@modwrench/nexus/register`, etc. Local dev didn't catch this
      # because stale dist/ from prior builds was already present.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publishable:
    # Workspace symlinks make every internal dependency resolve locally, so a
    # green build says nothing about whether the packages would actually
    # install for a stranger. This job checks what the build cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check release readiness
        run: npm run check:publishable
