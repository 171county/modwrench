name: Publish to MCP Registry

# Superseded by release.yml, which publishes npm first and only then updates
# the registry. Kept for manual re-publishing of registry metadata alone.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # The registry entry points at npm packages whose provenance and TRUST.md need this
      # repository to be public (see release.yml).
      - name: Refuse to publish from a private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::This repository is private. Make it public before publishing ModWrench anywhere (see release.yml)."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
