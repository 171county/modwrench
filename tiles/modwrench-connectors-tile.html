<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ModWrench — mod deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070809;--panel:#0d1013;--panel2:#11151a;--line:#1c232b;--ink:#e9eef3;--dim:#7f8b99;
    --hud:#35e0ec;--amber:#ffb000;--ok:#46e08a;--warn:#ffb648;--bad:#ff4d44;
    --mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Rajdhani",system-ui,sans-serif;
    --cp:#fcee0a;--sf:#ff7a33;--fo:#46e08a;--wi:#d8b34a;--rd:#c0392b;--sk:#6db6e0;
  }
  body{background:radial-gradient(120% 80% at 50% -10%,#10161c 0%,#070809 60%);min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;
    font-family:var(--disp);color:var(--ink);-webkit-font-smoothing:antialiased}

  .deck{position:relative;width:620px;max-width:100%;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);clip-path:polygon(0 16px,16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);
    box-shadow:0 40px 120px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
  .deck::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px),
      radial-gradient(120% 90% at 50% 0%,transparent 60%,rgba(0,0,0,.5) 100%);mix-blend-mode:multiply;opacity:.7}

  .top{position:relative;display:flex;align-items:center;gap:14px;padding:18px 22px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(53,224,236,.05),transparent)}
  .mk{width:34px;height:34px;flex:none;border:1px solid var(--hud);display:grid;place-items:center;
    background:linear-gradient(180deg,rgba(53,224,236,.16),rgba(53,224,236,.03));
    clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
  .mk b{font-weight:700;color:var(--hud);font-size:18px;line-height:1;text-shadow:0 0 10px rgba(53,224,236,.7)}
  .wm{font-weight:700;font-size:22px;letter-spacing:3px;line-height:1}
  .wm span{color:var(--hud);text-shadow:0 0 12px rgba(53,224,236,.45)}
  .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:3px}
  .top .spacer{flex:1}
  .readout{font-family:var(--mono);font-size:10px;color:var(--hud);text-align:right;letter-spacing:.5px;line-height:1.7}
  .readout b{color:var(--ink)}

  .sectlab{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--dim);padding:16px 22px 0;display:flex;align-items:center;gap:10px}
  .sectlab::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .rail{display:flex;gap:12px;padding:12px 22px 4px;overflow-x:auto;scrollbar-width:thin}
  .rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:var(--line)}
  .world{flex:none;width:158px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    transition:transform .16s,border-color .16s,box-shadow .16s;position:relative}
  .world:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 14px 30px -12px var(--ac),0 0 0 1px var(--ac) inset}
  .cover{height:74px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:9px 10px;
    background:linear-gradient(135deg,var(--ac) -40%,rgba(7,8,9,.2) 55%),linear-gradient(180deg,#11161c,#070809)}
  .cover::before{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(0,0,0,.28) 9px 10px)}
  .cover::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
  .wn{position:relative;z-index:1;font-weight:700;font-size:15px;line-height:1.05;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  .wmeta{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
  .ld{font-family:var(--mono);font-size:9px;color:var(--ac);border:1px solid var(--ac);padding:2px 5px;letter-spacing:.5px}
  .wc{font-family:var(--mono);font-size:10px;color:var(--ink)}.wc i{color:var(--dim);font-style:normal}

  .srcs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 22px 6px}
  .src{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    padding:8px 11px;font-family:var(--mono);font-size:11px;transition:border-color .15s,background .15s}
  .src:hover{border-color:var(--hud);background:rgba(255,255,255,.03)}
  .src .d{width:7px;height:7px;flex:none}.src .d.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .src .d.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}.src .d.off{background:var(--bad)}
  .src .nm{color:var(--ink);font-weight:500}.src .ct{color:var(--dim)}

  .foot{display:flex;align-items:center;gap:12px;padding:14px 22px;margin-top:8px;border-top:1px solid var(--line);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
  .foot .log{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.5px}.foot .spacer{flex:1}
  .cta{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:1px;color:var(--bg);cursor:pointer;border:none;
    background:var(--hud);padding:9px 14px;clip-path:polygon(0 5px,5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);
    box-shadow:0 0 16px rgba(53,224,236,.4)}.cta:active{transform:translateY(1px)}

  .panel{position:absolute;inset:0;z-index:12;background:linear-gradient(180deg,rgba(10,13,17,.98),rgba(7,8,9,.99));
    display:flex;flex-direction:column;transform:translateY(10px);opacity:0;pointer-events:none;transition:.22s}
  .panel.show{transform:none;opacity:1;pointer-events:auto}
  .pbar{height:4px;background:var(--hud)}
  .phead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .back{width:32px;height:32px;flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:15px;font-family:var(--mono)}
  .back:hover{border-color:var(--hud);color:var(--hud)}
  .phead .pt{font-weight:700;font-size:18px;letter-spacing:.5px}
  .phead .pl{font-family:var(--mono);font-size:10px;color:var(--hud);margin-top:2px}
  .pbody{flex:1;overflow:auto;padding:14px 20px 20px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);margin-bottom:8px;background:var(--panel2)}
  .row .rk{font-family:var(--mono);font-size:11px;color:var(--ac);width:22px}
  .row .tt{font-weight:600;font-size:14px}.row .mm{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:1px}
  .row .dl{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink)}
  .sl{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);margin:14px 0 9px}
  .find{display:flex;flex-wrap:wrap;gap:8px}
  .fb{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--line);background:var(--panel2);padding:9px 12px;cursor:pointer;transition:.14s}
  .fb:hover{border-color:var(--hud);color:var(--hud);box-shadow:0 0 14px -4px var(--hud)}
  .fb small{color:var(--dim)}
</style>
</head>
<body>
  <div class="deck">
    <div class="top">
      <div class="mk"><b>/</b></div>
      <div><div class="wm">MOD<span>WRENCH</span></div><div class="sub">// mod deck · read-only recon</div></div>
      <div class="spacer"></div>
      <div class="readout"><b id="wcount">6</b> worlds · <b id="scount">5</b> sources<br><span id="log">all systems nominal</span></div>
    </div>

    <div class="sectlab">MODDABLE&nbsp;WORLDS</div>
    <div class="rail" id="rail"></div>

    <div class="sectlab">SOURCES</div>
    <div class="srcs" id="srcs"></div>

    <div class="foot">
      <span class="log">ModWrench never writes — it reads, identifies, and diagnoses.</span>
      <div class="spacer"></div>
      <button class="cta" onclick="act('mw_activate_platform',null)">+ CONNECT SOURCE</button>
    </div>

    <div class="panel" id="panel">
      <div class="pbar" id="pbar"></div>
      <div class="phead">
        <button class="back" onclick="closeP()">&larr;</button>
        <div style="flex:1"><div class="pt" id="pt">—</div><div class="pl" id="pl">—</div></div>
      </div>
      <div class="pbody" id="pbody"></div>
    </div>
  </div>

<script>
  const WORLDS=[
    {id:"cp",name:"Cyberpunk 2077",ac:"--cp",loader:"CET / REDmod",mods:"18,420",dom:"cyberpunk2077",
      top:[["Better Vehicle Handling","mod.io · phys"],["Nova City Overhaul","Nexus · visual"],["Appearance Menu Mod","Nexus · tools"]]},
    {id:"sf",name:"Starfield",ac:"--sf",loader:"SFSE",mods:"12,900",dom:"starfield",
      top:[["StarUI HUD","Nexus · UI"],["Ship Builder Unlocked","Nexus · gameplay"],["DLSS Frame Gen","Nexus · perf"]]},
    {id:"fo",name:"Fallout 4",ac:"--fo",loader:"F4SE",mods:"31,200",dom:"fallout4",
      top:[["Sim Settlements 2","Nexus · overhaul"],["Unofficial Patch","Nexus · fixes"],["Weaponsmith Extended","Nexus · weapons"]]},
    {id:"wi",name:"The Witcher 3",ac:"--wi",loader:"Script Merger",mods:"9,640",dom:"witcher3",
      top:[["HD Reworked Project","Nexus · visual"],["Friendly HUD","Nexus · UI"],["Brothers In Arms","Nexus · quests"]]},
    {id:"rd",name:"Red Dead 2",ac:"--rd",loader:"LML",mods:"5,310",dom:"reddeadredemption2",
      top:[["WhyEm's DLC","mod.io · content"],["Rampage Trainer","Nexus · tools"],["Crime & Law Rebalance","Nexus · gameplay"]]},
    {id:"sk",name:"Skyrim SE",ac:"--sk",loader:"SKSE64",mods:"68,000",dom:"skyrimspecialedition",
      top:[["SkyUI","Nexus · UI"],["Unofficial Patch","Nexus · fixes"],["Legacy of the Dragonborn","Nexus · overhaul"]]}
  ];
  const SRC=[
    {id:"nexus",nm:"Nexus Mods",ct:"13",status:"on",tool:"nexus_search"},
    {id:"modio",nm:"mod.io",ct:"17",status:"on",tool:"modio_search_mods"},
    {id:"thunder",nm:"Thunderstore",ct:"7",status:"on",tool:"thunderstore_search_mods"},
    {id:"curse",nm:"CurseForge",ct:"10",status:"warn",tool:"curseforge_search_mods"},
    {id:"bench",nm:"Workbench",ct:"6",status:"on",tool:"check_load_order"}
  ];
  let cur=null;
  const $=id=>document.getElementById(id);

  function worldCard(w){return `<div class="world" style="--ac:var(${w.ac})" onclick="openW('${w.id}')">
      <div class="cover"><div class="wn">${w.name}</div></div>
      <div class="wmeta"><span class="ld">${w.loader}</span><span class="wc">${w.mods}<i> mods</i></span></div>
    </div>`;}
  function srcChip(s){return `<div class="src" onclick="act('${s.tool}','${s.id}')" title="${s.tool}">
      <span class="d ${s.status}"></span><span class="nm">${s.nm}</span><span class="ct">${s.ct} tools</span></div>`;}
  function render(){$('rail').innerHTML=WORLDS.map(worldCard).join('');$('srcs').innerHTML=SRC.map(srcChip).join('');
    $('wcount').textContent=WORLDS.length;$('scount').textContent=SRC.filter(s=>s.status!=='off').length;}

  function openW(id){cur=WORLDS.find(w=>w.id===id);
    $('pbar').style.background=`var(${cur.ac})`;$('pbar').style.boxShadow=`0 0 16px var(${cur.ac})`;
    $('pt').textContent=cur.name;$('pl').textContent='loader · '+cur.loader+'   ·   '+cur.mods+' mods tracked';
    $('pl').style.color=`var(${cur.ac})`;
    const rows=cur.top.map((t,i)=>`<div class="row" style="--ac:var(${cur.ac})">
      <span class="rk">${String(i+1).padStart(2,'0')}</span>
      <div style="flex:1"><div class="tt">${t[0]}</div><div class="mm">${t[1]}</div></div>
      <span class="dl">open</span></div>`).join('');
    const finds=SRC.map(s=>`<button class="fb" onclick="event.stopPropagation();act('${s.tool}','${cur.dom}')">${s.nm} <small>&rsaquo;</small></button>`).join('');
    $('pbody').innerHTML=`<div class="sl">TOP MODS · TRACKED</div>${rows}
      <div class="sl">SEARCH THIS WORLD ACROSS SOURCES</div><div class="find">${finds}</div>`;
    $('panel').classList.add('show');flash('▸ '+cur.name);}
  function closeP(){$('panel').classList.remove('show');cur=null;}

  function act(n,id){flash('→ '+(id?`${n}("${id}")`:`${n}()`));try{window.parent.postMessage({type:'tool',payload:{name:n,arguments:{target:id}}},'*');}catch(e){}}
  function flash(t){const l=$('log');l.textContent=t;l.style.color='var(--hud)';setTimeout(()=>l.style.color='',1200);}
  render();
</script>
</body>
</html>
